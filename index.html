<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Telegram Channel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #570004; /* Dark maroon background from screenshot */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: linear-gradient(180deg, #990012 0%, #d6001c 100%); /* Red gradient container */
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
        }

        /* Profile Section */
        .profile-card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
        }

        .profile-img {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            border: 2px solid #ffcc00;
            object-fit: cover;
        }

        .profile-info h1 {
            color: #ffcc00; /* Yellow text */
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .profile-info p {
            color: #ffffff;
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .badges {
            display: flex;
            gap: 8px;
        }

        .badge {
            font-size: 11px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 20px;
        }

        .badge-yellow { background-color: #ffcc00; color: #000; }
        .badge-red { background-color: #ff3344; color: #fff; }

        /* Buttons & Features */
        .btn-join {
            background-color: #ffcc00;
            color: #000000;
            display: block;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
        }

        .btn-join:hover {
            transform: scale(1.02);
        }

        .feature-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
            color: white;
        }

        .feature-icon {
            background-color: #ffcc00;
            color: #000;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
        }

        .feature-text h3 {
            font-size: 15px;
            margin-bottom: 2px;
        }

        .feature-text p {
            font-size: 12px;
            opacity: 0.7;
        }

        /* Footer Disclaimer */
        .disclaimer {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            margin-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="profile-card">
            <img class="profile-img" src="https://via.placeholder.com/100" alt="Logo">
            <div class="profile-info">
                <h1>APNA NAAM</h1>
                <p>Premium Analysis & Predictions</p>
                <div class="badges">
                    <span class="badge badge-yellow">★ Premium Analyst</span>
                    <span class="badge badge-red">● Live Updates</span>
                </div>
            </div>
        </div>

        <a href="https://t.me/your_channel" class="btn-join" target="_blank">✈ JOIN TELEGRAM NOW</a>

        <div class="feature-box">
            <div class="feature-icon">📊</div>
            <div class="feature-text">
                <h3>Expert Analysis</h3>
                <p>Professional insights and tips</p>
            </div>
        </div>

        <div class="feature-box">
            <div class="feature-icon">⚡</div>
            <div class="feature-text">
                <h3>Live Match Updates</h3>
                <p>Real-time coverage & scores</p>
            </div>
        </div>

        <div class="feature-box">
            <div class="feature-icon">👥</div>
            <div class="feature-text">
                <h3>Active Community</h3>
                <p>Connect with sports fans</p>
            </div>
        </div>

        <a href="https://t.me/your_channel" class="btn-join" target="_blank">✈ JOIN TELEGRAM NOW</a>

        <div class="disclaimer">
            For entertainment purposes only.
        </div>

    </div>

</body>
</html>
